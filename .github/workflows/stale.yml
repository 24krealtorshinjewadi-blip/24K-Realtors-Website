name: "🕰️ Stale Issue & PR Manager"

on:
  schedule:
    - cron: "0 3 * * 1"  # Every Monday at 3am UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: "Mark & Close Stale Items"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Issues
          days-before-issue-stale: 14
          days-before-issue-close: 7
          stale-issue-label: "stale"
          stale-issue-message: >
            👋 This issue has been inactive for 14 days. It will be automatically closed in 7 days unless there's further activity.
            If this is still relevant, please comment or update the issue.
          close-issue-message: >
            🔒 This issue was automatically closed due to inactivity. Feel free to reopen if still relevant.

          # PRs
          days-before-pr-stale: 7
          days-before-pr-close: 5
          stale-pr-label: "stale"
          stale-pr-message: >
            ⏳ This PR has been inactive for 7 days. It will be automatically closed in 5 days unless there's activity.
            Please address any review comments or merge when ready.
          close-pr-message: >
            🔒 This PR was automatically closed due to inactivity. Feel free to reopen when ready.

          # Never stale these labels
          exempt-issue-labels: "pinned,security,in-progress,blocked"
          exempt-pr-labels: "pinned,security,in-progress,do-not-merge"
