name: CI — Build & Test

on:
  push:
    branches: [ main, feature/*, fix/*, hotfix/* ]
  pull_request:
    branches: [ main ]

jobs:
  backend-build:
    name: "Backend — Maven Compile"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compile Backend
        run: ./mvnw compile -q

      - name: Run Backend Tests
        run: ./mvnw test -q

  frontend-build:
    name: "Frontend — Vite Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Bundle
        run: npm run build
        env:
          VITE_API_BASE_URL: https://twentyfourk-backend-production.up.railway.app/api/v1
