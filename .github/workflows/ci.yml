name: "🔁 CI — Build, Lint & Test"

on:
  push:
    branches: [main, "feature/**", "fix/**", "hotfix/**", "chore/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────
  # JOB 1 — BACKEND (Spring Boot + Maven)
  # ─────────────────────────────────────────
  backend:
    name: "☕ Backend — Compile & Test"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4

      - name: "☕ Set up JDK 21 (Temurin)"
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: "🔨 Compile Backend"
        run: ./mvnw compile -q -B

      - name: "🧪 Run Unit & Integration Tests"
        run: ./mvnw test -B
        env:
          SPRING_PROFILES_ACTIVE: test

      - name: "📊 Upload Test Results"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/target/surefire-reports/

  # ─────────────────────────────────────────
  # JOB 2 — FRONTEND (React + Vite)
  # ─────────────────────────────────────────
  frontend:
    name: "⚛️ Frontend — Lint & Build"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4

      - name: "🟢 Set up Node.js 20"
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: "📦 Install Dependencies"
        run: npm ci

      - name: "🔍 Lint (ESLint)"
        run: npm run lint --if-present

      - name: "🏗️ Build Production Bundle"
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL || 'https://twentyfourk-backend-production.up.railway.app/api/v1' }}
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}

      - name: "📊 Upload Build Artifact"
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 3

  # ─────────────────────────────────────────
  # JOB 3 — CI STATUS SUMMARY
  # ─────────────────────────────────────────
  ci-summary:
    name: "✅ CI Complete"
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: always()
    steps:
      - name: "Check all jobs passed"
        run: |
          if [[ "${{ needs.backend.result }}" == "success" && "${{ needs.frontend.result }}" == "success" ]]; then
            echo "✅ All CI checks passed!"
          else
            echo "❌ CI failed — Backend: ${{ needs.backend.result }}, Frontend: ${{ needs.frontend.result }}"
            exit 1
          fi
