name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Job 1: Build, Test, and Verify Spring Boot Backend
  build-backend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Cache Maven Dependencies
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Compile & Build Jar Package (backend module)
      working-directory: backend
      run: mvn clean package -DskipTests -B

    - name: Verify Backend Dockerfile Build
      run: |
        docker build -t twentyfourk-backend-test .

  # Job 2: Build and Package React Frontend
  build-frontend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'

    - name: Install Frontend Dependencies
      working-directory: frontend
      run: npm ci

    - name: Build Frontend Static Bundle
      working-directory: frontend
      run: npm run build

    - name: Verify Frontend Dockerfile Build
      working-directory: frontend
      run: |
        docker build -t twentyfourk-frontend-test .
