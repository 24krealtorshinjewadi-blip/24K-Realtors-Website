version: '3.8'

services:
  # Database Service (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: twentyfourk-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=twentyfourk
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  # Backend Service (Spring Boot API)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: twentyfourk-backend
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=twentyfourk
      - DB_USER=postgres
      - DB_PASSWORD=postgres
    restart: on-failure

  # Frontend Service (Nginx + React Portal & Dashboard)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: twentyfourk-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
    driver: local
