spring:
  profiles:
    active: dev
  application:
    name: twentyfourk-realestate
  # Disable auto-configuration of JavaMailSender (we use Resend HTTP API directly)
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.mail.MailSenderAutoConfiguration

# ─── Resend.com Email Delivery ───────────────────────────────────────────────
# Set RESEND_API_KEY in Railway env vars. Get free key from https://resend.com
resend:
  api-key: ${RESEND_API_KEY:re_i5gvY6vM_HP3ityQM5oCDbYgn7d6BMW5g}
  from: ${RESEND_FROM:24K Realtors <onboarding@resend.dev>}

whatsapp:
  api:
    url: ${WHATSAPP_API_URL:https://graph.facebook.com/v20.0/103984029348928/messages}
    token: ${WHATSAPP_API_TOKEN:EAAXX_PLACEHOLDER_MOCK_TOKEN}
    template: ${WHATSAPP_API_TEMPLATE:welcome_lead_intro}

twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  from-number: ${TWILIO_FROM_NUMBER:}

# ─── Fast2SMS (Indian SMS Gateway — cheaper than Twilio for India) ────────────
# Get API key from https://www.fast2sms.com → API → Dev API Key
# Set FAST2SMS_API_KEY env var. If set, takes priority over Twilio.
fast2sms:
  api-key: ${FAST2SMS_API_KEY:}

jwt:
  secret: ${JWT_SECRET:YTI5M2Y0YjVkNmQ4Zjg5YTA5YjQzOWM1YTMzYjM1YzZmNzI4ZjkzYWUzYzYyN2M4ODliMWMzNmRmOTBhN2M4ZQ==}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

admin:
  username: ${ADMIN_USERNAME:admin}
  password: ${ADMIN_PASSWORD:adminpassword}

# Spring Boot Actuator — expose health endpoint for container orchestration (shares main port)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}

---
# Development Profile (Active by default, uses H2 database)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:twentyfourkdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: password
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 10000
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: none # Flyway manages DB creation
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc.batch_size: 25
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    clean-disabled: true

server:
  port: 8080

---
# Production Profile (uses PostgreSQL)
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:twentyfourk}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 8
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none # Flyway manages DB creation in production
    show-sql: false
    properties:
      hibernate:
        jdbc.batch_size: 25
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    clean-disabled: true

server:
  port: 8080

---
# Railway Cloud Profile (PostgreSQL auto-provisioned by Railway)
spring:
  config:
    activate:
      on-profile: railway
  datasource:
    # Railway provides both DATABASE_URL and individual PGHOST/PGPORT/PGDATABASE vars
    # Using individual vars here - main() parses DATABASE_URL as system properties if available
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:railway}?sslmode=require
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 600000
      connection-test-query: SELECT 1
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        jdbc.batch_size: 25
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    clean-disabled: true

server:
  port: ${PORT:8080}
