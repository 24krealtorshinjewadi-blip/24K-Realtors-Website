<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" width="100%" height="100%">
  <defs>
    <!-- Metallic Gold Gradients -->
    <linearGradient id="goldKeyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBE6" />
      <stop offset="20%" stop-color="#F7E294" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="80%" stop-color="#AA7C1E" />
      <stop offset="100%" stop-color="#6E4D0C" />
    </linearGradient>

    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF8D6" />
      <stop offset="35%" stop-color="#F5D77F" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#9E7820" />
    </linearGradient>

    <linearGradient id="goldShaftGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF2B2" />
      <stop offset="45%" stop-color="#E5C158" />
      <stop offset="75%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8A6314" />
    </linearGradient>

    <linearGradient id="goldWindowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6" />
      <stop offset="50%" stop-color="#E8CA72" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>

    <!-- Subtle Luxury Glow Filter -->
    <filter id="luxuryGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#D4AF37" flood-opacity="0.4" />
    </filter>
  </defs>

  <g id="logo-centered" transform="translate(0, 0)" filter="url(#luxuryGlow)">
    <!-- ═══ 1. CROSSED GOLDEN KEYS EMBLEM ═══ -->
    <g id="keys-emblem" transform="translate(90, 0)">
      <!-- Left Key (Rotated ~-32deg) -->
      <g transform="translate(110, 48) rotate(-32)">
        <circle cx="0" cy="-44" r="17" fill="none" stroke="url(#goldKeyGrad)" stroke-width="5.5" />
        <circle cx="0" cy="-44" r="9" fill="none" stroke="url(#goldKeyGrad)" stroke-width="3" />
        <circle cx="-13" cy="-52" r="5" fill="none" stroke="url(#goldKeyGrad)" stroke-width="2.5" />
        <circle cx="13" cy="-52" r="5" fill="none" stroke="url(#goldKeyGrad)" stroke-width="2.5" />
        <circle cx="0" cy="-62" r="4" fill="none" stroke="url(#goldKeyGrad)" stroke-width="2.2" />

        <rect x="-4.5" y="-27" width="9" height="74" rx="3.5" fill="url(#goldShaftGrad)" />
        <line x1="0" y1="-25" x2="0" y2="44" stroke="#FFFCEB" stroke-width="1.2" opacity="0.8" />

        <path d="M 4.5 16 L 16 16 L 16 23 L 4.5 23 Z M 4.5 27 L 13 27 L 13 34 L 4.5 34 Z M 4.5 38 L 18 38 L 18 45 L 4.5 45 Z" fill="url(#goldKeyGrad)" />
        <circle cx="0" cy="47" r="4.5" fill="url(#goldKeyGrad)" />
      </g>

      <!-- Right Key (Rotated ~+32deg) -->
      <g transform="translate(110, 48) rotate(32)">
        <circle cx="0" cy="-44" r="17" fill="none" stroke="url(#goldKeyGrad)" stroke-width="5.5" />
        <circle cx="0" cy="-44" r="9" fill="none" stroke="url(#goldKeyGrad)" stroke-width="3" />
        <circle cx="-13" cy="-52" r="5" fill="none" stroke="url(#goldKeyGrad)" stroke-width="2.5" />
        <circle cx="13" cy="-52" r="5" fill="none" stroke="url(#goldKeyGrad)" stroke-width="2.5" />
        <circle cx="0" cy="-62" r="4" fill="none" stroke="url(#goldKeyGrad)" stroke-width="2.2" />

        <rect x="-4.5" y="-27" width="9" height="74" rx="3.5" fill="url(#goldShaftGrad)" />
        <line x1="0" y1="-25" x2="0" y2="44" stroke="#FFFCEB" stroke-width="1.2" opacity="0.8" />

        <path d="M -4.5 16 L -16 16 L -16 23 L -4.5 23 Z M -4.5 27 L -13 27 L -13 34 L -4.5 34 Z M -4.5 38 L -18 38 L -18 45 L -4.5 45 Z" fill="url(#goldKeyGrad)" />
        <circle cx="0" cy="47" r="4.5" fill="url(#goldKeyGrad)" />
      </g>

      <!-- Crossing Rivet -->
      <circle cx="110" cy="48" r="7" fill="url(#goldKeyGrad)" stroke="#1A1202" stroke-width="1.5" />
      <polygon points="110,43 114,47 114,51 110,54 106,51 106,47" fill="#FFFCEB" />

      <!-- 4-Pane Arched Window -->
      <g id="house-window" transform="translate(110, 68)">
        <path d="M -13 18 L -13 0 Q 0 -10 13 0 L 13 18 Z" fill="none" stroke="url(#goldKeyGrad)" stroke-width="2.8" stroke-linejoin="round" />
        <line x1="-16" y1="18" x2="16" y2="18" stroke="url(#goldKeyGrad)" stroke-width="3" stroke-linecap="round" />
        <path d="M -10 -0.5 Q -4 -6 -1.8 -7.5 L -1.8 -0.5 Z" fill="url(#goldWindowGrad)" />
        <path d="M 10 -0.5 Q 4 -6 1.8 -7.5 L 1.8 -0.5 Z" fill="url(#goldWindowGrad)" />
        <rect x="-10" y="2.5" width="8.2" height="12.5" rx="1" fill="url(#goldWindowGrad)" />
        <rect x="1.8" y="2.5" width="8.2" height="12.5" rx="1" fill="url(#goldWindowGrad)" />
      </g>
    </g>

    <!-- ═══ 2. BRAND TYPOGRAPHY ═══ -->
    <text
      x="200"
      y="165"
      text-anchor="middle"
      font-family="'Cinzel', 'Playfair Display', Georgia, serif"
      font-size="28"
      font-weight="800"
      letter-spacing="0.22em"
      fill="url(#goldTextGrad)"
    >
      24K REALTORS
    </text>

    <text
      x="200"
      y="195"
      text-anchor="middle"
      font-family="'Montserrat', 'Cinzel', sans-serif"
      font-size="12"
      font-weight="700"
      letter-spacing="0.32em"
      fill="#E8CA72"
      opacity="0.95"
    >
      FIND YOUR SELF AT HOME
    </text>
  </g>
</svg>
