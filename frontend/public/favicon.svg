<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="favBgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141E30" />
      <stop offset="100%" stop-color="#070D18" />
    </radialGradient>
    <linearGradient id="favGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBE6" />
      <stop offset="20%" stop-color="#F7E294" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="80%" stop-color="#AA7C1E" />
      <stop offset="100%" stop-color="#6E4D0C" />
    </linearGradient>
    <linearGradient id="favShaftGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF2B2" />
      <stop offset="45%" stop-color="#E5C158" />
      <stop offset="75%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#8A6314" />
    </linearGradient>
    <linearGradient id="favWinGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D6" />
      <stop offset="50%" stop-color="#E8CA72" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D4AF37" flood-opacity="0.55" />
    </filter>
  </defs>

  <!-- Dark Luxury Rounded Badge -->
  <rect width="128" height="128" rx="28" fill="url(#favBgGrad)" stroke="url(#favGoldGrad)" stroke-width="2.5" />

  <!-- Crossed Keys + House Window Emblem -->
  <g transform="translate(64, 62) scale(0.52)" filter="url(#favGlow)">
    <!-- Left Key -->
    <g transform="translate(0, -18) rotate(-32)">
      <circle cx="0" cy="-44" r="17" fill="none" stroke="url(#favGoldGrad)" stroke-width="5.5" />
      <circle cx="0" cy="-44" r="9" fill="none" stroke="url(#favGoldGrad)" stroke-width="3" />
      <circle cx="-13" cy="-52" r="5" fill="none" stroke="url(#favGoldGrad)" stroke-width="2.5" />
      <circle cx="13" cy="-52" r="5" fill="none" stroke="url(#favGoldGrad)" stroke-width="2.5" />
      <circle cx="0" cy="-62" r="4" fill="none" stroke="url(#favGoldGrad)" stroke-width="2.2" />
      <rect x="-4.5" y="-27" width="9" height="74" rx="3.5" fill="url(#favShaftGrad)" />
      <line x1="0" y1="-25" x2="0" y2="44" stroke="#FFFCEB" stroke-width="1.2" opacity="0.8" />
      <path d="M 4.5 16 L 16 16 L 16 23 L 4.5 23 Z M 4.5 27 L 13 27 L 13 34 L 4.5 34 Z M 4.5 38 L 18 38 L 18 45 L 4.5 45 Z" fill="url(#favGoldGrad)" />
      <circle cx="0" cy="47" r="4.5" fill="url(#favGoldGrad)" />
    </g>

    <!-- Right Key -->
    <g transform="translate(0, -18) rotate(32)">
      <circle cx="0" cy="-44" r="17" fill="none" stroke="url(#favGoldGrad)" stroke-width="5.5" />
      <circle cx="0" cy="-44" r="9" fill="none" stroke="url(#favGoldGrad)" stroke-width="3" />
      <circle cx="-13" cy="-52" r="5" fill="none" stroke="url(#favGoldGrad)" stroke-width="2.5" />
      <circle cx="13" cy="-52" r="5" fill="none" stroke="url(#favGoldGrad)" stroke-width="2.5" />
      <circle cx="0" cy="-62" r="4" fill="none" stroke="url(#favGoldGrad)" stroke-width="2.2" />
      <rect x="-4.5" y="-27" width="9" height="74" rx="3.5" fill="url(#favShaftGrad)" />
      <line x1="0" y1="-25" x2="0" y2="44" stroke="#FFFCEB" stroke-width="1.2" opacity="0.8" />
      <path d="M -4.5 16 L -16 16 L -16 23 L -4.5 23 Z M -4.5 27 L -13 27 L -13 34 L -4.5 34 Z M -4.5 38 L -18 38 L -18 45 L -4.5 45 Z" fill="url(#favGoldGrad)" />
      <circle cx="0" cy="47" r="4.5" fill="url(#favGoldGrad)" />
    </g>

    <!-- Center Rivet -->
    <circle cx="0" cy="-18" r="7" fill="url(#favGoldGrad)" stroke="#1A1202" stroke-width="1.5" />
    <polygon points="0,-23 4,-19 4,-15 0,-12 -4,-15 -4,-19" fill="#FFFCEB" />

    <!-- 4-Pane Arched Window -->
    <g transform="translate(0, 2)">
      <path d="M -13 18 L -13 0 Q 0 -10 13 0 L 13 18 Z" fill="none" stroke="url(#favGoldGrad)" stroke-width="2.8" stroke-linejoin="round" />
      <line x1="-16" y1="18" x2="16" y2="18" stroke="url(#favGoldGrad)" stroke-width="3" stroke-linecap="round" />
      <path d="M -10 -0.5 Q -4 -6 -1.8 -7.5 L -1.8 -0.5 Z" fill="url(#favWinGrad)" />
      <path d="M 10 -0.5 Q 4 -6 1.8 -7.5 L 1.8 -0.5 Z" fill="url(#favWinGrad)" />
      <rect x="-10" y="2.5" width="8.2" height="12.5" rx="1" fill="url(#favWinGrad)" />
      <rect x="1.8" y="2.5" width="8.2" height="12.5" rx="1" fill="url(#favWinGrad)" />
    </g>
  </g>
</svg>