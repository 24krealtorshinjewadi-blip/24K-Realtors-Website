<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <radialGradient id="favBgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#141E30" />
      <stop offset="100%" stop-color="#070D18" />
    </radialGradient>
    <linearGradient id="favGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3B0" />
      <stop offset="30%" stop-color="#E5C158" />
      <stop offset="60%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#7A560D" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#D4AF37" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Dark Luxury Shield / Circle Base -->
  <rect width="128" height="128" rx="28" fill="url(#favBgGrad)" stroke="url(#favGoldGrad)" stroke-width="3" />

  <!-- Crossed Antique Gold Keys Emblem -->
  <g transform="translate(64, 64) scale(0.68)" filter="url(#favGlow)">
    <!-- Decorative Concentric Rings -->
    <circle cx="0" cy="0" r="70" fill="none" stroke="url(#favGoldGrad)" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.5" />
    <circle cx="0" cy="0" r="62" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.75" />

    <!-- KEY 1 (-45 deg) -->
    <g transform="rotate(-45)">
      <circle cx="0" cy="-44" r="16" fill="none" stroke="url(#favGoldGrad)" stroke-width="4.5" />
      <circle cx="0" cy="-44" r="9" fill="none" stroke="url(#favGoldGrad)" stroke-width="2.5" />
      <circle cx="-13" cy="-44" r="6" fill="none" stroke="url(#favGoldGrad)" stroke-width="2" />
      <circle cx="13" cy="-44" r="6" fill="none" stroke="url(#favGoldGrad)" stroke-width="2" />
      <circle cx="0" cy="-57" r="5" fill="none" stroke="url(#favGoldGrad)" stroke-width="2" />
      <circle cx="0" cy="-31" r="5" fill="none" stroke="url(#favGoldGrad)" stroke-width="2" />
      <circle cx="0" cy="-44" r="3" fill="url(#favGoldGrad)" />
      <rect x="-6" y="-27" width="12" height="4" rx="2" fill="url(#favGoldGrad)" />
      <rect x="-4.5" y="-22" width="9" height="3" rx="1.5" fill="url(#favGoldGrad)" />
      <rect x="-3" y="-20" width="6" height="66" rx="2" fill="url(#favGoldGrad)" />
      <line x1="0" y1="-18" x2="0" y2="44" stroke="#FFF7D6" stroke-width="1.2" opacity="0.8" />
      <path d="M 3 24 L 18 24 L 18 30 L 11 30 L 11 35 L 17 35 L 17 41 L 11 41 L 11 46 L 19 46 L 19 52 L 3 52 Z" fill="url(#favGoldGrad)" />
      <circle cx="0" cy="46" r="3.5" fill="url(#favGoldGrad)" />
    </g>

    <!-- KEY 2 (+45 deg) -->
    <g transform="rotate(45)">
      <circle cx="0" cy="-44" r="16" fill="none" stroke="url(#favGoldGrad)" stroke-width="4.5" />
      <circle cx="0" cy="-44" r="9" fill="none" stroke="url(#favGoldGrad)" stroke-width="2.5" />
      <circle cx="-13" cy="-44" r="6" fill="none" stroke="url(#favGoldGrad)" stroke-width="2" />
      <circle cx="13" cy="-44" r="6" fill="none" stroke="url(#favGoldGrad)" stroke-width="2" />
      <circle cx="0" cy="-57" r="5" fill="none" stroke="url(#favGoldGrad)" stroke-width="2" />
      <circle cx="0" cy="-31" r="5" fill="none" stroke="url(#favGoldGrad)" stroke-width="2" />
      <circle cx="0" cy="-44" r="3" fill="url(#favGoldGrad)" />
      <rect x="-6" y="-27" width="12" height="4" rx="2" fill="url(#favGoldGrad)" />
      <rect x="-4.5" y="-22" width="9" height="3" rx="1.5" fill="url(#favGoldGrad)" />
      <rect x="-3" y="-20" width="6" height="66" rx="2" fill="url(#favGoldGrad)" />
      <line x1="0" y1="-18" x2="0" y2="44" stroke="#FFF7D6" stroke-width="1.2" opacity="0.8" />
      <path d="M -3 24 L -18 24 L -18 30 L -11 30 L -11 35 L -17 35 L -17 41 L -11 41 L -11 46 L -19 46 L -19 52 L -3 52 Z" fill="url(#favGoldGrad)" />
      <circle cx="0" cy="46" r="3.5" fill="url(#favGoldGrad)" />
    </g>

    <!-- Center Jewel -->
    <circle cx="0" cy="0" r="7" fill="url(#favGoldGrad)" stroke="#070D18" stroke-width="1.5" />
    <polygon points="0,-4 3,-1 4,3 0,5 -4,3 -3,-1" fill="#FFFFFF" />
  </g>
</svg>